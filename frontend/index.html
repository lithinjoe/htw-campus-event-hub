<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTW Campus Event Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>HTW Event Hub</h1>
            <div class="role-selector">
                <label for="userRole">Role:</label>
                <select id="userRole">
                    <option value="guest">Guest</option>
                    <option value="student">Student</option>
                    <option value="organizer">Organizer / Admin</option>
                </select>
            </div>
        </div>
        <nav>
            <button class="nav-btn active" data-view="catalogView">Event Catalog</button>
            <button class="nav-btn student-only" data-view="myRegistrationsView">My Registrations</button>
            <button class="nav-btn organizer-only" data-view="organizerDashboardView">Organizer Dashboard</button>
        </nav>
    </header>

    <main>
        <section id="catalogView" class="view-section">
            <h2>Upcoming Campus Events</h2>
            <div class="filter-controls">
                <input type="text" id="searchInput" placeholder="Search events...">
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Career">Career</option>
                    <option value="Social">Social</option>
                    <option value="Academic">Academic</option>
                </select>
            </div>
            <div id="eventsList" class="card-grid"></div>
        </section>

        <section id="detailView" class="view-section hidden">
            <button id="backToCatalogBtn">&larr; Back to Events</button>
            <article id="eventDetailContent"></article>
        </section>

        <section id="registerView" class="view-section hidden">
            <h2>Register for Event</h2>
            <form id="registrationForm">
                <input type="hidden" id="regEventId">
                
                <label for="studentName">Full Name:</label>
                <input type="text" id="studentName" required>
                <span class="error-msg" id="nameError"></span>

                <label for="studentEmail">HTW Student Email:</label>
                <input type="email" id="studentEmail" placeholder="s0XXXXXX@htw-berlin.de" required>
                <span class="error-msg" id="emailError"></span>

                <label for="studyProgram">Study Program:</label>
                <input type="text" id="studyProgram" placeholder="e.g. Cyber Security" required>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Confirm Registration</button>
                    <button type="button" id="cancelRegBtn" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </section>

        <section id="myRegistrationsView" class="view-section hidden">
            <h2>My Registrations</h2>
            <div id="studentRegistrationsList"></div>
        </section>

        <section id="organizerDashboardView" class="view-section hidden">
            <h2>Organizer Dashboard</h2>
            <button id="openCreateEventModal" class="btn-primary">+ Create New Event</button>

            <form id="eventForm" class="hidden">
                <h3 id="formTitle">Add Event</h3>
                <input type="hidden" id="eventId">

                <label for="eventTitle">Title:</label>
                <input type="text" id="eventTitle" required>

                <label for="eventCategory">Category:</label>
                <select id="eventCategory">
                    <option value="Workshop">Workshop</option>
                    <option value="Career">Career</option>
                    <option value="Social">Social</option>
                    <option value="Academic">Academic</option>
                </select>

                <label for="eventDate">Date:</label>
                <input type="date" id="eventDate" required>

                <label for="eventLocation">Location / Room:</label>
                <input type="text" id="eventLocation" required>

                <label for="eventDescription">Description:</label>
                <textarea id="eventDescription" rows="4" required></textarea>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Event</button>
                    <button type="button" id="cancelEventBtn" class="btn-secondary">Cancel</button>
                </div>
            </form>

            <h3 style="margin-top: 1.5rem;">Managed Events</h3>
            <div id="organizerEventsList"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HTW Berlin - Cloud & Web Application Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
