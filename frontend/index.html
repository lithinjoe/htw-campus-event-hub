<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTW Campus Event Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>HTW Campus Event Hub</h1>
            <div class="role-selector">
                <label for="userRole">Current Role:</label>
                <select id="userRole">
                    <option value="guest">Guest</option>
                    <option value="student">Student</option>
                    <option value="organizer">Organizer</option>
                </select>
            </div>
        </div>
        <nav>
            <button class="nav-btn active" data-view="catalogView">Event Catalog</button>
            <button class="nav-btn student-only" data-view="myRegistrationsView">My Registrations</button>
            <button class="nav-btn organizer-only" data-view="organizerDashboardView">Organizer Dashboard</button>
        </nav>
    </header>

    <main>
        <!-- 1. Catalog View -->
        <section id="catalogView" class="view-section">
            <h2>Upcoming Campus Events</h2>
            <div class="filter-controls">
                <input type="text" id="searchInput" placeholder="Search events...">
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Career">Career</option>
                    <option value="Social">Social</option>
                </select>
            </div>
            <div id="eventsList" class="card-grid"></div>
        </section>

        <!-- 2. Event Detail View -->
        <section id="detailView" class="view-section hidden">
            <button id="backToCatalogBtn" class="btn-secondary" style="margin-bottom: 1rem;">&larr; Back to Catalog</button>
            <div id="eventDetailContent"></div>
        </section>

        <!-- 3. Registration Form View -->
        <section id="registerView" class="view-section hidden">
            <h2>Event Registration</h2>
            <form id="registrationForm">
                <input type="hidden" id="regEventId">
                
                <div>
                    <label for="studentName">Full Name:</label>
                    <input type="text" id="studentName" required>
                    <span id="nameError" class="error-msg"></span>
                </div>

                <div>
                    <label for="studentEmail">HTW Email (@htw-berlin.de):</label>
                    <input type="email" id="studentEmail" placeholder="s0123456@htw-berlin.de" required>
                    <span id="emailError" class="error-msg"></span>
                </div>

                <div>
                    <label for="studyProgram">Study Program:</label>
                    <input type="text" id="studyProgram" placeholder="e.g. Cybersecurity" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Confirm Registration</button>
                    <button type="button" id="cancelRegBtn" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </section>

        <!-- 4. Student Dashboard View -->
        <section id="myRegistrationsView" class="view-section hidden">
            <h2>My Registrations</h2>
            <div id="studentRegistrationsList" style="margin-top: 1rem;"></div>
        </section>

        <!-- 5. Organizer Dashboard View -->
        <section id="organizerDashboardView" class="view-section hidden">
            <h2>Organizer Dashboard</h2>
            <button id="openCreateEventModal" class="btn-primary" style="margin: 1rem 0;">+ Add New Event</button>

            <form id="eventForm" class="hidden" style="margin-bottom: 2rem; border: 1px solid #E0E0E0; padding: 1.5rem; border-radius: 6px;">
                <h3 id="formTitle">Add Event</h3>
                <input type="hidden" id="eventId">

                <label for="eventTitle">Event Title:</label>
                <input type="text" id="eventTitle" required>

                <label for="eventCategory">Category:</label>
                <select id="eventCategory">
                    <option value="Workshop">Workshop</option>
                    <option value="Career">Career</option>
                    <option value="Social">Social</option>
                </select>

                <label for="eventDate">Date:</label>
                <input type="date" id="eventDate" required>

                <label for="eventLocation">Location:</label>
                <input type="text" id="eventLocation" required>

                <label for="eventImage">Banner Image URL (Azure Blob Storage):</label>
                <input type="text" id="eventImage" placeholder="https://htweventstore.blob.core.windows.net/banners/sample.jpg">

                <label for="eventDescription">Description:</label>
                <textarea id="eventDescription" rows="3" required></textarea>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Event</button>
                    <button type="button" id="cancelEventBtn" class="btn-secondary">Cancel</button>
                </div>
            </form>

            <div id="organizerEventsList"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HTW Berlin - Campus Event Hub</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
